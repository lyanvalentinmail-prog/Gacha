name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: Chibiverse-Gacha-Studio

jobs:
  build:
    name: Compilar APK firmado
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurar la caché de Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Proveedor de caché 100% open source (actions/cache)
          cache-provider: basic

      - name: Instalar las dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Calcular la versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          # versionCode debe crecer en cada compilación para poder actualizar la app
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Preparar los archivos del APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${APK_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${APK_NAME}-v${{ steps.version.outputs.name }}.apk"
          ls -lh artifacts

      - name: Verificar la firma del APK
        shell: bash
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "artifacts/${APK_NAME}.apk"

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: APK-v${{ steps.version.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Crear las notas de la versión
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## ✨ Chibiverse Gacha Studio v${{ steps.version.outputs.name }}

          APK firmado listo para instalar en **Android 7.0 o superior** (API 24+).

          ### 📲 Cómo instalar
          1. Descarga el archivo **${APK_NAME}.apk** desde la sección *Assets* de esta versión.
          2. Abre el archivo desde el navegador o el gestor de descargas de tu teléfono.
          3. Si Android lo pide, permite **instalar apps de esta fuente** (Ajustes → Seguridad → Instalar apps desconocidas) y acepta el aviso de Play Protect eligiendo **"Instalar de todas formas"**.
          4. Abre la app y empieza a crear tus personajes. ✨

          > La APK está firmada con una clave pública incluida en el repositorio para que las actualizaciones se instalen encima de la versión anterior sin desinstalar. No es una build válida para Google Play.

          <sub>Compilado desde el commit ${{ github.sha }} · [Ver la ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
          EOF

      - name: Publicar en GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Etiqueta fija: https://github.com/OWNER/REPO/releases/latest/download/Chibiverse-Gacha-Studio.apk
            TAG="latest"
          fi

          TITLE="Chibiverse Gacha Studio v${{ steps.version.outputs.name }} (APK)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/*.apk \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
